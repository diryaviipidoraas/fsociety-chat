<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>fsociety room chat</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0a;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    #header {
      border-bottom: 1px solid #00ff41;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #header .logo { font-size:1.2rem; font-weight:bold; letter-spacing:2px; }
    #header .logo span { color:#00cc33; }
    #room-info { font-size:0.9rem; color:#66ff66; }
    #output {
      flex:1;
      overflow-y:auto;
      border:1px solid #1a3a1a;
      padding:12px;
      background:#0d0d0d;
      border-radius:6px;
      white-space:pre-wrap;
      word-wrap:break-word;
      margin:10px 0;
    }
    .time { color:#446644; font-size:0.7rem; margin-right:8px; }
    .local { color:#00ff41; }
    .remote { color:#66ddff; }
    .system { color:#88aa88; font-style:italic; }
    #input-line {
      display: flex;
      align-items: center;
      flex-shrink:0;
      border-top:1px solid #1a3a1a;
      padding-top:10px;
    }
    #input-line .prompt { color:#00ff41; margin-right:10px; font-weight:bold; }
    #input-line input {
      background:transparent;
      border:none;
      color:#00ff41;
      font-family:inherit;
      font-size:1rem;
      width:100%;
      outline:none;
    }
    #input-line input:disabled { color:#335533; }
    .blink { animation:blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>
</head>
<body>

<div id="header">
  <div class="logo"><span>fsociety</span> :: room chat</div>
  <div id="room-info">комната: <span id="roomName">загрузка...</span></div>
</div>

<div id="output">
  <span class="system">[fsociety] ожидание сообщений...</span>
</div>

<div id="input-line">
  <span class="prompt">[elliot@fsociety ~]$</span>
  <input type="text" id="msgInput" placeholder="введите сообщение..." disabled>
</div>

<!-- Подключаем GunDB -->
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>

<script>
  (function() {
    // --- Запрашиваем имя комнаты (один раз при загрузке) ---
    let room = prompt("Введите название комнаты (например, fsociety):", "fsociety");
    if (!room) room = "fsociety";
    document.getElementById('roomName').textContent = room;

    // --- Инициализируем Gun (используем публичные релеи) ---
    const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);

    // Получаем ссылку на сообщения в этой комнате
    const messagesRef = gun.get(room).get('messages');

    // --- Элементы UI ---
    const output = document.getElementById('output');
    const msgInput = document.getElementById('msgInput');

    // --- Функция добавления сообщения в лог ---
    function addMessage(text, type = 'system') {
      const line = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = `[${time}]`;
      line.appendChild(timeSpan);

      const msgSpan = document.createElement('span');
      msgSpan.className = type;
      msgSpan.textContent = text;
      line.appendChild(msgSpan);

      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    // --- Подписываемся на новые сообщения ---
    // gun-данные хранятся как список записей с уникальными ключами
    messagesRef.map().on(function(value, key) {
      if (value && value.text && value.from) {
        // Проверяем, не своё ли сообщение (чтобы не дублировать)
        // Gun может выдавать уже имеющиеся, поэтому проверим по ключу, чтобы не повторяться
        // Для простоты будем выводить всё, но можно хранить локальный сет для избежания дублей
        // Сделаем так: если сообщение уже есть в выводе, пропускаем (проверка по тексту+времени)
        // Но проще: добавим уникальный флаг.
        // Здесь используем подход: будем сохранять ключи выведенных сообщений в Set
        if (!window._shownKeys) window._shownKeys = new Set();
        if (window._shownKeys.has(key)) return;
        window._shownKeys.add(key);

        const isMine = value.from === localStorage.getItem('fsociety_username');
        const type = isMine ? 'local' : 'remote';
        const displayName = isMine ? 'вы' : value.from;
        addMessage(`[${displayName}] ${value.text}`, type);
      }
    });

    // --- Придумываем имя пользователя (сохраняем в localStorage) ---
    let username = localStorage.getItem('fsociety_username');
    if (!username) {
      username = 'user_' + Math.floor(Math.random() * 10000);
      localStorage.setItem('fsociety_username', username);
    }

    // --- Отправка сообщения ---
    function sendMessage(text) {
      text = text.trim();
      if (!text) return;
      // Создаём запись в списке сообщений
      const msg = {
        text: text,
        from: username,
        timestamp: Date.now()
      };
      messagesRef.set(msg); // set создаёт новую запись с уникальным ключом
      // Сразу локально добавим (но т.к. подписка сработает, можно не дублировать)
      // Однако из-за задержек сети добавим сразу для быстрого отображения
      // Но чтобы не дублировать, проверим, что подписка ещё не получила это сообщение
      // Добавим локально без ожидания от сервера (но тогда может дублироваться)
      // Проще: полагаемся на подписку, она придёт через мгновение.
      // Очистим поле ввода
      msgInput.value = '';
    }

    // --- Ввод сообщения ---
    msgInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage(this.value);
      }
    });

    // --- Активируем поле ввода после загрузки ---
    msgInput.disabled = false;
    msgInput.placeholder = 'введите сообщение...';
    msgInput.focus();

    addMessage(`[система] Вы вошли в комнату "${room}" как ${username}`, 'system');

    // --- Дополнительно: клик по заголовку комнаты для смены ---
    document.getElementById('roomName').style.cursor = 'pointer';
    document.getElementById('roomName').title = 'Кликни, чтобы сменить комнату';
    document.getElementById('roomName').addEventListener('click', function() {
      const newRoom = prompt("Введите новое название комнаты:", room);
      if (newRoom && newRoom !== room) {
        // Перезагружаем страницу с новым параметром
        localStorage.setItem('fsociety_last_room', newRoom);
        location.reload();
      }
    });

    // Если при загрузке есть сохранённая комната, используем её
    const saved = localStorage.getItem('fsociety_last_room');
    if (saved && !room) {
      room = saved;
      document.getElementById('roomName').textContent = room;
    }

  })();
</script>
</body>
</html>
