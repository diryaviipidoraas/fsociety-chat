<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>fsociety terminal chat</title>
  <style>
    /* === Стиль как в терминале === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    #header {
      border-bottom: 1px solid #00ff41;
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #header .logo {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    #header .logo span {
      color: #00cc33;
    }
    #header .status {
      font-size: 0.9rem;
      color: #66ff66;
    }
    #peer-id-box {
      background: #111;
      padding: 8px 14px;
      border: 1px solid #00ff41;
      border-radius: 4px;
      font-size: 0.9rem;
      display: inline-block;
    }
    #peer-id-box strong {
      color: #88ff88;
    }
    #connect-area {
      flex-shrink: 0;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    #connect-area input {
      background: #111;
      border: 1px solid #00ff41;
      color: #00ff41;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 1rem;
      border-radius: 4px;
      outline: none;
      flex: 1 1 200px;
    }
    #connect-area button {
      background: #00ff41;
      color: #0a0a0a;
      border: none;
      padding: 6px 18px;
      font-family: inherit;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    #connect-area button:hover {
      background: #66ff88;
    }
    #output {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #1a3a1a;
      padding: 12px;
      background: #0d0d0d;
      border-radius: 6px;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 10px;
      min-height: 200px;
    }
    #output .time {
      color: #446644;
      font-size: 0.7rem;
      margin-right: 8px;
    }
    #output .system {
      color: #88aa88;
      font-style: italic;
    }
    #output .local {
      color: #00ff41;
    }
    #output .remote {
      color: #66ddff;
    }
    #input-line {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      border-top: 1px solid #1a3a1a;
      padding-top: 10px;
    }
    #input-line .prompt {
      color: #00ff41;
      margin-right: 10px;
      font-weight: bold;
    }
    #input-line input {
      background: transparent;
      border: none;
      color: #00ff41;
      font-family: inherit;
      font-size: 1rem;
      width: 100%;
      outline: none;
    }
    #input-line input::placeholder {
      color: #335533;
    }
    .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .ascii-mask {
      color: #1a4a1a;
      font-size: 0.6rem;
      line-height: 1.2;
      white-space: pre;
      text-align: right;
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      #header { flex-wrap: wrap; gap: 8px; }
      .ascii-mask { display: none; }
    }
  </style>
</head>
<body>

<div id="header">
  <div class="logo">
    <span>fsociety</span> :: terminal
  </div>
  <div class="status" id="statusLabel">
    <span id="peerIdDisplay">—</span>
  </div>
</div>

<div id="connect-area">
  <span style="color:#88ff88;">Твой ID:</span>
  <span id="myPeerId" style="background:#111; padding:4px 12px; border:1px solid #00ff41; border-radius:4px;">загрузка...</span>
  <input type="text" id="remoteIdInput" placeholder="Введи ID друга">
  <button id="connectBtn">подключиться</button>
  <button id="disconnectBtn" style="background:#663333; color:#ff8888;">отключить</button>
</div>

<div id="output">
  <span class="system">[fsociety] ожидание подключения...</span>
</div>

<div id="input-line">
  <span class="prompt">[elliot@fsociety ~]$</span>
  <input type="text" id="msgInput" placeholder="введите сообщение..." disabled>
</div>

<!-- PeerJS CDN -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
  (function() {
    const output = document.getElementById('output');
    const myIdSpan = document.getElementById('myPeerId');
    const remoteInput = document.getElementById('remoteIdInput');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const msgInput = document.getElementById('msgInput');
    const statusLabel = document.getElementById('statusLabel');

    let peer = null;
    let conn = null;          // активное соединение
    let myPeerId = null;

    // === Вспомогательные функции ===
    function log(message, type = 'system') {
      const line = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = `[${time}]`;
      line.appendChild(timeSpan);

      const msgSpan = document.createElement('span');
      msgSpan.className = type;
      msgSpan.textContent = message;
      line.appendChild(msgSpan);

      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function setStatus(text, isConnected = false) {
      statusLabel.innerHTML = text;
      if (isConnected) {
        statusLabel.style.color = '#66ff66';
      } else {
        statusLabel.style.color = '#66ff66';
      }
    }

    function enableInput(enabled) {
      msgInput.disabled = !enabled;
      if (enabled) {
        msgInput.placeholder = 'введите сообщение...';
        msgInput.focus();
      } else {
        msgInput.placeholder = 'нет соединения';
      }
    }

    // === Инициализация Peer ===
    function initPeer() {
      // Публичный сервер PeerJS
      peer = new Peer(undefined, {
        host: '0.peerjs.com',
        port: 443,
        path: '/',
        secure: true
      });

      peer.on('open', (id) => {
        myPeerId = id;
        myIdSpan.textContent = id;
        setStatus(`ID: ${id} | ожидание подключения`);
        log(`Ваш ID: ${id}`, 'system');
        // Автоматически пытаемся подключиться, если в remoteInput уже что-то есть
        // но лучше оставить вручную
      });

      peer.on('connection', (incomingConn) => {
        // Кто-то подключается к нам
        if (conn) {
          // уже есть соединение — отклоним новое
          incomingConn.close();
          log('Входящее соединение отклонено (уже есть активное)', 'system');
          return;
        }
        conn = incomingConn;
        setupConnection(conn, true);
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        if (err.type === 'peer-unavailable') {
          log('Ошибка: ID друга не найден', 'system');
        } else {
          log(`Ошибка: ${err.message}`, 'system');
        }
      });

      // Обработка закрытия peer (при обновлении страницы и т.д.)
      peer.on('close', () => {
        log('Соединение с сервером потеряно', 'system');
        if (conn) {
          conn.close();
          conn = null;
          enableInput(false);
          setStatus('отключено');
        }
      });
    }

    // === Настройка соединения ===
    function setupConnection(connection, isIncoming) {
      conn = connection;

      conn.on('open', () => {
        const peerId = conn.peer;
        log(`Соединение установлено с ${peerId}`, 'system');
        setStatus(`подключено к ${peerId}`, true);
        enableInput(true);
        msgInput.focus();
        // Если входящее — оповестим
        if (isIncoming) {
          log('Входящее соединение принято', 'system');
        } else {
          log('Исходящее соединение установлено', 'system');
        }
      });

      conn.on('data', (data) => {
        // Получено сообщение от собеседника
        log(`[${conn.peer}] ${data}`, 'remote');
      });

      conn.on('close', () => {
        log('Соединение закрыто собеседником', 'system');
        if (conn === connection) {
          conn = null;
          enableInput(false);
          setStatus('отключено');
        }
      });

      conn.on('error', (err) => {
        log(`Ошибка соединения: ${err.message}`, 'system');
        if (conn === connection) {
          conn = null;
          enableInput(false);
          setStatus('ошибка');
        }
      });
    }

    // === Подключение к другу ===
    function connectToPeer(remoteId) {
      if (!peer) {
        log('Peer не инициализирован', 'system');
        return;
      }
      if (conn) {
        log('Уже есть активное соединение', 'system');
        return;
      }
      if (!remoteId || remoteId.trim() === '') {
        log('Введите ID друга', 'system');
        return;
      }
      remoteId = remoteId.trim();
      if (remoteId === myPeerId) {
        log('Нельзя подключиться к самому себе', 'system');
        return;
      }

      log(`Пытаюсь подключиться к ${remoteId}...`, 'system');
      const newConn = peer.connect(remoteId, {
        reliable: true
      });
      // Настройка будет после открытия
      setupConnection(newConn, false);
    }

    // === Отключение ===
    function disconnect() {
      if (conn) {
        conn.close();
        conn = null;
        enableInput(false);
        setStatus('отключено');
        log('Соединение разорвано', 'system');
      } else {
        log('Нет активного соединения', 'system');
      }
    }

    // === Отправка сообщения ===
    function sendMessage(text) {
      if (!conn) {
        log('Нет соединения', 'system');
        return;
      }
      if (!text || text.trim() === '') return;
      const msg = text.trim();
      conn.send(msg);
      log(`[вы] ${msg}`, 'local');
      msgInput.value = '';
    }

    // === События UI ===
    connectBtn.addEventListener('click', () => {
      const remoteId = remoteInput.value.trim();
      connectToPeer(remoteId);
    });

    disconnectBtn.addEventListener('click', disconnect);

    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage(msgInput.value);
      }
    });

    // На случай, если пользователь нажмёт Enter в поле ввода ID
    remoteInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        connectBtn.click();
      }
    });

    // === Запуск ===
    initPeer();

    // Потеря фокуса — возвращаем фокус на ввод сообщений
    document.addEventListener('click', () => {
      if (!msgInput.disabled) {
        msgInput.focus();
      }
    });

    // Дополнительно: копирование ID по клику
    myIdSpan.style.cursor = 'pointer';
    myIdSpan.title = 'Кликни, чтобы скопировать ID';
    myIdSpan.addEventListener('click', () => {
      if (myPeerId) {
        navigator.clipboard.writeText(myPeerId).then(() => {
          log('ID скопирован в буфер обмена', 'system');
        }).catch(() => {
          // fallback
          const range = document.createRange();
          range.selectNode(myIdSpan);
          window.getSelection().removeAllRanges();
          window.getSelection().addRange(range);
          document.execCommand('copy');
          log('ID скопирован (старый способ)', 'system');
        });
      }
    });

  })();
</script>

</body>
</html>
