<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>fsociety room chat</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0a;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    #header {
      border-bottom: 1px solid #00ff41;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #header .logo { font-size:1.2rem; font-weight:bold; letter-spacing:2px; }
    #header .logo span { color:#00cc33; }
    #room-info { font-size:0.9rem; color:#66ff66; cursor:pointer; }
    #output {
      flex:1;
      overflow-y:auto;
      border:1px solid #1a3a1a;
      padding:12px;
      background:#0d0d0d;
      border-radius:6px;
      white-space:pre-wrap;
      word-wrap:break-word;
      margin:10px 0;
    }
    .time { color:#446644; font-size:0.7rem; margin-right:8px; }
    .local { color:#00ff41; }
    .remote { color:#66ddff; }
    .system { color:#88aa88; font-style:italic; }
    #input-line {
      display: flex;
      align-items: center;
      flex-shrink:0;
      border-top:1px solid #1a3a1a;
      padding-top:10px;
    }
    #input-line .prompt { color:#00ff41; margin-right:10px; font-weight:bold; }
    #input-line input {
      background:transparent;
      border:none;
      color:#00ff41;
      font-family:inherit;
      font-size:1rem;
      width:100%;
      outline:none;
    }
    #input-line input:disabled { color:#335533; }
    .blink { animation:blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>
</head>
<body>

<div id="header">
  <div class="logo"><span>fsociety</span> :: room chat</div>
  <div id="room-info">комната: <span id="roomName">загрузка...</span></div>
</div>

<div id="output">
  <span class="system">[fsociety] ожидание сообщений...</span>
</div>

<div id="input-line">
  <span class="prompt">[elliot@fsociety ~]$</span>
  <input type="text" id="msgInput" placeholder="введите сообщение..." disabled>
</div>

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script>
  (function() {
    // --- Запрашиваем имя комнаты ---
    let room = prompt("Введите название комнаты (например, fsociety):", "fsociety");
    if (!room) room = "fsociety";
    document.getElementById('roomName').textContent = room;

    // --- Инициализация Gun с несколькими релеями (для надёжности) ---
    const gun = Gun([
      'https://gun-manhattan.herokuapp.com/gun',
      'https://gun-us.herokuapp.com/gun',
      'https://gun-eu.herokuapp.com/gun'
    ]);

    // Получаем ссылку на список сообщений комнаты
    const messagesRef = gun.get(room).get('messages');

    // --- Элементы UI ---
    const output = document.getElementById('output');
    const msgInput = document.getElementById('msgInput');

    // --- Вспомогательная функция добавления сообщения в лог ---
    function addMessage(text, type = 'system') {
      const line = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = `[${time}]`;
      line.appendChild(timeSpan);

      const msgSpan = document.createElement('span');
      msgSpan.className = type;
      msgSpan.textContent = text;
      line.appendChild(msgSpan);

      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    // --- Придумываем имя пользователя (сохраняем в localStorage) ---
    let username = localStorage.getItem('fsociety_username');
    if (!username) {
      username = 'user_' + Math.floor(Math.random() * 10000);
      localStorage.setItem('fsociety_username', username);
    }
    addMessage(`[система] Вы вошли как ${username} в комнату "${room}"`, 'system');

    // --- Подписка на новые сообщения (с защитой от дублей) ---
    const shownKeys = new Set();
    messagesRef.map().on(function(value, key) {
      if (!value || !value.text || !value.from) return;
      if (shownKeys.has(key)) return;
      shownKeys.add(key);

      const isMine = (value.from === username);
      const type = isMine ? 'local' : 'remote';
      const displayName = isMine ? 'вы' : value.from;
      addMessage(`[${displayName}] ${value.text}`, type);
    });

    // --- Отправка сообщения ---
    function sendMessage(text) {
      text = text.trim();
      if (!text) return;

      const msg = {
        text: text,
        from: username,
        timestamp: Date.now()
      };

      // Генерируем уникальный ключ на основе времени и случайного числа
      const key = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      // Сохраняем под ключом
      messagesRef.get(key).put(msg, function(ack) {
        if (ack.err) {
          console.error('Ошибка отправки:', ack.err);
          addMessage('[ошибка] Сообщение не отправлено, попробуйте ещё раз', 'system');
        } else {
          // Успешно отправлено (но сообщение появится через подписку)
        }
      });

      // Очищаем поле
      msgInput.value = '';
    }

    // --- Обработчик ввода ---
    msgInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage(this.value);
      }
    });

    // --- Активируем поле ввода ---
    msgInput.disabled = false;
    msgInput.placeholder = 'введите сообщение...';
    msgInput.focus();

    // --- Смена комнаты по клику ---
    document.getElementById('roomName').addEventListener('click', function() {
      const newRoom = prompt("Введите новое название комнаты:", room);
      if (newRoom && newRoom !== room) {
        localStorage.setItem('fsociety_last_room', newRoom);
        location.reload();
      }
    });

    // Автоматическая загрузка последней комнаты (если есть)
    const saved = localStorage.getItem('fsociety_last_room');
    if (saved && !room) {
      room = saved;
      document.getElementById('roomName').textContent = room;
    }

    // --- Для отладки: покажем статус соединения ---
    console.log('Gun подключен к релеям, комната:', room);
  })();
</script>
</body>
</html>
